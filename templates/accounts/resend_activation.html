{% extends "base.html" %}

{% block title %}Resend Activation Link | AgroConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow p-4 p-md-5" style="border-radius: var(--radius-lg);">
                <div class="text-center mb-4">
                    <i class="fas fa-paper-plane text-success mb-3" style="font-size: 3rem;"></i>
                    <h1 class="h4 fw-bold text-dark mb-1">Resend Activation</h1>
                    <p class="text-muted small">Enter your email address to receive a new verification link.</p>
                </div>
                
                <form action="{% url 'resend_activation' %}" method="POST" class="needs-validation" novalidate>
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold small text-muted">Email Address</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="enter your email address" value="{{ email }}" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary-green w-100 py-2.5 fw-bold mb-3">Send Verification Link</button>
                    
                    <div class="text-center small">
                        <a href="{% url 'login' %}" class="text-success text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
