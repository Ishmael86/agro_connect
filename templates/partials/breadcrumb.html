<nav aria-label="breadcrumb" class="py-2">
    <ol class="breadcrumb mb-4 align-items-center" style="font-size: 0.9rem; background: transparent; padding: 0;">
        <li class="breadcrumb-item">
            <a href="{% url 'home' %}" class="text-success fw-medium">
                <i class="fas fa-home me-1"></i> Home
            </a>
        </li>
        {% for label, url in breadcrumbs %}
            {% if forloop.last %}
                <li class="breadcrumb-item active text-muted fw-normal" aria-current="page">{{ label }}</li>
            {% else %}
                <li class="breadcrumb-item">
                    <a href="{{ url }}" class="text-success fw-medium">{{ label }}</a>
                </li>
            {% endif %}
        {% endfor %}
    </ol>
</nav>
